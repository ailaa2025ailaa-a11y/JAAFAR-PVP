name: Build JAFAAR PvP

on:
  push:
    paths:
      - 'JAFAAR_PvP_Fabric_26_1_Build5.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q JAFAAR_PvP_Fabric_26_1_Build5.zip -d project
          echo "Project files:"
          find project -maxdepth 6 -type f | sort | head -250

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f project/settings.gradle ] || [ -f project/settings.gradle.kts ]; then
            ROOT="project"
          else
            BUILD_FILE="$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
            if [ -z "$BUILD_FILE" ]; then
              echo "No Gradle build file found."
              exit 1
            fi
            ROOT="$(dirname "$BUILD_FILE")"
          fi
          echo "Building from: $ROOT"
          cd "$ROOT"
          gradle --no-daemon build

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JAFAAR-PvP-Fabric-26.1
          path: project/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
