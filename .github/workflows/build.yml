name: Build JAFAAR PvP

on:
  push:
    paths:
      - 'JAFAAR_PvP_Fabric_26_1_Build5.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q JAFAAR_PvP_Fabric_26_1_Build5.zip -d project
          echo "Files found in archive:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Locate project and build
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)")"
          if [ "$ROOT" = "." ] || [ -z "$ROOT" ]; then
            ROOT="$(dirname "$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)")"
          fi
          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "Could not find Gradle project files in the ZIP."
            exit 1
          fi
          echo "Building from: $ROOT"
          cd "$ROOT"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon build
          else
            echo "Gradle wrapper (gradlew) is missing; cannot safely select a Gradle version yet."
            exit 1
          fi

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JAFAAR-PvP-Fabric-26.1
          path: project/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
