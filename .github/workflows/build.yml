name: Build JAFAAR PvP

on:
  push:
    paths:
      - 'JAFAAR_PvP_Fabric_26_1_Build5.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q JAFAAR_PvP_Fabric_26_1_Build5.zip -d project
          echo "Project files:"
          find project -maxdepth 6 -type f | sort | head -250

      - name: Allow Fabric Loom repositories
        shell: bash
        run: |
          set -euo pipefail
          if [ -f project/settings.gradle ]; then
            sed -i '/repositoriesMode/d' project/settings.gradle
            echo "Removed settings-level repository mode restriction."
          elif [ -f project/settings.gradle.kts ]; then
            sed -i '/repositoriesMode/d' project/settings.gradle.kts
            echo "Removed settings-level repository mode restriction."
          else
            echo "No settings.gradle found."
            exit 1
          fi
          echo "Updated Gradle settings:"
          cat project/settings.gradle 2>/dev/null || cat project/settings.gradle.kts

      - name: Remove obsolete mappings declaration for unobfuscated Minecraft
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'officialMojangMappings' project/build.gradle; then
            sed -i '/officialMojangMappings/d' project/build.gradle
            echo "Removed Mojang mappings declaration; this Minecraft version uses unobfuscated names."
          else
            echo "Expected Mojang mappings declaration was not found."
            echo "Build configuration:"
            nl -ba project/build.gradle | head -40
            exit 1
          fi
          echo "Updated build.gradle:"
          nl -ba project/build.gradle | head -40

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail
          cd project
          gradle --no-daemon build

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JAFAAR-PvP-Fabric-26.1
          path: project/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
